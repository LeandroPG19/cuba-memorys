name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check + Clippy + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check

      - name: cargo fmt --check
        run: cargo fmt --check

      # --all-targets lints tests/ and examples/ too; -D promotes warnings to
      # errors. The old `-W clippy::all` only warned, and without --all-targets
      # clippy never even compiled rust/tests/.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # The `docs` feature ships in the release binaries, so it has to be tested like
      # the release binaries. It was not, and cuba_docs shipped to nobody for a whole
      # version: the published build is the DEFAULT build, and the feature was off by
      # default. A feature CI never compiles is a feature nobody is checking.
      - name: cargo clippy (--features docs)
        run: cargo clippy --all-targets --features docs -- -D warnings

      - name: cargo test (--features docs)
        run: cargo test --features docs

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      # deny.toml has existed for releases declaring the anti-GPL/AGPL policy that
      # keeps a future dual-license option open — and nothing ever ran it, so the
      # policy applied to none of the 433 transitive dependencies.
      - name: cargo deny
        run: |
          cargo install cargo-deny --quiet
          cargo deny check licenses bans sources

      # The npm wrapper is how most people install this, and it once shipped a package
      # whose binary was never fetched. This smoke test loads bin.js/postinstall.js and
      # checks the fetch-on-first-use wiring without needing a network or a release —
      # a broken require or a renamed export here breaks every `npm install`.
      - name: npm wrapper smoke test
        working-directory: .
        run: node npm/install.test.js

  e2e:
    name: E2E Tests
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: cuba
          POSTGRES_PASSWORD: memorys2026
          POSTGRES_DB: brain
        ports:
          - 5488:5432
        options: >-
          --health-cmd "pg_isready -U cuba -d brain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust DB integration tests
        env:
          DATABASE_URL: postgresql://cuba:memorys2026@127.0.0.1:5488/brain
        run: |
          cargo test --test integration --test v08_project_scoping --test v09_integration \
                     --test v021_audit_append_under_app_role --test v021_audit_downgrade \
                     --test v021_import_quarantine_all_kinds \
                     --test v022_merge_reports_what_it_drops --test v022_sync_takes_a_lock \
                     --test v022_same_name_different_id --test v022_bundle_is_validated_first --test v023_tombstones --test v023_node_identity \
                     --test v023_sync_clock --test v023_history_is_kept --test v023_counters_merge --test v023_bundle_carries_the_clock \
                     --test v024_hand_edited_bundle --test v024_embedding_guard \
                     --test v024_tombstone_lists_agree --test v024_facts_and_procedures_travel \
                     --test v016_quarantine --test v016_relation_extraction \
                     --test v017_codegraph_hardening \
                     -- --ignored --nocapture
          cargo test --lib -- --ignored --nocapture
          CUBA_APP_ROLE=0 cargo test --test v020_audit_update_applies \
                     --test v020_role_separation -- --ignored --nocapture

      - name: Run E2E tests (25 MCP tools)
        env:
          DATABASE_URL: postgresql://cuba:memorys2026@127.0.0.1:5488/brain
          CUBA_BINARY_PATH: ./target/release/cuba-memorys
          CUBA_JUDGE: heuristic
        run: python tests/e2e_all_tools.py

  # The publish matrix builds five targets with three different feature sets, and
  # until now nothing compiled any of them until a `v*` tag was already pushed. The
  # v0.20.0 release found out the hard way: aarch64-linux, both macOS targets and
  # musl all built, and x86_64-pc-windows-msvc failed in `Build (cargo)`, after the
  # tag existed. Windows carries the largest feature set (docs,cuda,directml) and
  # directml is compiled nowhere else, so it is the one most likely to break and the
  # last one to find out.
  #
  # cargo check, not build: it catches the compile errors that broke that release
  # without paying for codegen and linking on five runners for every push.
  release-matrix:
    name: Compiles as released — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: docs,cuda
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            features: docs
            cross_cc: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
            features: docs
          - os: macos-latest
            target: aarch64-apple-darwin
            features: docs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: docs,cuda,directml

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build scripts compile both C and C++ for the target, so `cargo check --target`
      # needs a cross toolchain even though it never links the binary — and it needs
      # BOTH, in separate Debian packages. Measured, one failure at a time: with
      # neither, cc-rs cannot find `aarch64-linux-gnu-gcc`; with only gcc it gets
      # further and then cannot find `aarch64-linux-gnu-g++`; with both, aarch64
      # checks clean in 20s. The first version of this job shipped with only gcc and
      # went red on aarch64 for exactly that reason, which is the failure mode this
      # comment exists to prevent repeating: a toolchain gap wearing a compile error's
      # clothes teaches everyone to ignore the job. macOS and Windows runners already
      # ship a native toolchain for their own targets.
      - name: Cross toolchain
        if: matrix.cross_cc != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_cc }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-check-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-check-

      - name: cargo check (release features for this target)
        working-directory: rust
        run: cargo check --release --features ${{ matrix.features }} --target ${{ matrix.target }}
